# Author-quality test: run the 4AM->ANE authoring pipeline on a self-hosted (local)
# runner using ANTHROPIC_TOKEN, and surface the produced note. Dispatch-only.
name: authoring-test
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        required: false
        default: claude-opus-4-8
permissions:
  contents: read
jobs:
  author:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: prerequisites
        run: for b in jq curl awk; do command -v "$b" >/dev/null || { echo "::error::missing $b"; exit 1; }; done
      - name: run authoring pipeline
        env:
          ANTHROPIC_TOKEN: ${{ secrets.ANTHROPIC_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: bash .authoring/run.sh "${{ github.workspace }}/authoring-out"
      - name: upload note
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-note
          path: authoring-out/
          if-no-files-found: warn
