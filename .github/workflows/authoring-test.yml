# Thin caller: run the shared ANE-note authoring pipeline (in engineering-standards)
# on a self-hosted runner, using this repo's ANTHROPIC_TOKEN. Instructions (role prompts +
# corpus) live here under .authoring/; the pipeline logic lives in engineering-standards.
name: authoring-test
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        required: false
        default: claude-opus-4-8
jobs:
  author:
    uses: agentnativeengineering/engineering-standards/.github/workflows/reusable-author.yml@main
    with:
      runs-on: self-hosted
      model: ${{ inputs.model }}
    secrets:
      ANTHROPIC_TOKEN: ${{ secrets.ANTHROPIC_TOKEN }}
